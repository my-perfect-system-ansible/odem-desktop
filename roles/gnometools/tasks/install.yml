---
- name: Install GNOME tools (Debian)
  ansible.builtin.package:
    name:
      - gnome-system-monitor
      - network-manager-gnome
      - gnome-screenshot
      - gnome-extra-icons
      - gedit
      - gedit-plugins
    state: present
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install GNOME tools (RedHat via dnf CLI)
  ansible.builtin.command: dnf install -y gnome-system-monitor network-manager-applet gedit gedit-plugins
  when: ansible_facts['os_family'] == 'RedHat'
  register: dnf_install_gnometools
  changed_when: "'Nothing to do' not in dnf_install_gnometools.stdout"
  become: true
