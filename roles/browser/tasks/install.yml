---
- name: Install Firefox ESR (Debian)
  ansible.builtin.package:
    name: firefox-esr
    state: present
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - browser_enable_firefox | bool

- name: Install Firefox (RedHat via dnf CLI)
  ansible.builtin.command: dnf install -y firefox
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - browser_enable_firefox | bool
  register: dnf_install_firefox
  changed_when: "'Nothing to do' not in dnf_install_firefox.stdout"
  become: true

- name: Install Brave browser prerequisites (Debian)
  ansible.builtin.package:
    name: "{{ browser_brave_packages }}"
    state: present
    update_cache: true
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - browser_enable_brave | bool

- name: Download Brave GPG keyring (Debian)
  ansible.builtin.get_url:
    url: "{{ browser_brave_repo_url }}brave-browser-archive-keyring.gpg"
    dest: "{{ browser_brave_keyring_path }}"
    mode: "0644"
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - browser_enable_brave | bool

- name: Add Brave apt repository (Debian)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ browser_brave_keyring_path }}] {{ browser_brave_repo_url }} stable main"
    filename: "{{ browser_brave_apt_filename }}"
    state: present
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - browser_enable_brave | bool

- name: Install Brave browser package (Debian)
  ansible.builtin.package:
    name: brave-browser
    state: present
    update_cache: true
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - browser_enable_brave | bool