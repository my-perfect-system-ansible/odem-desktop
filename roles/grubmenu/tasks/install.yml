---
- name: Set RedHat GRUB paths
  ansible.builtin.set_fact:
    grubmenu_themes_dir: /boot/grub2/themes
    grubmenu_icons_dir: /boot/grub2/icons
  when: ansible_facts['os_family'] == 'RedHat'

- name: Ensure GRUB themes destination directory exists
  ansible.builtin.file:
    path: "{{ grubmenu_themes_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Copy GRUB themes
  ansible.builtin.copy:
    src: "{{ role_path }}/files/grub/themes/{{ item }}/"
    dest: "{{ grubmenu_themes_dir }}/{{ item }}/"
    owner: root
    group: root
    mode: preserve
  loop: "{{ grubmenu_themes }}"
  become: true

- name: Ensure GRUB icons destination directory exists
  ansible.builtin.file:
    path: "{{ grubmenu_icons_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Copy GRUB icon sets
  ansible.builtin.copy:
    src: "{{ role_path }}/files/grub/icons/{{ item }}/"
    dest: "{{ grubmenu_icons_dir }}/{{ item }}/"
    owner: root
    group: root
    mode: preserve
  loop: "{{ grubmenu_icons }}"
  become: true

- name: Ensure GRUB_GFXMODE is set in /etc/default/grub
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: "^GRUB_GFXMODE="
    line: "GRUB_GFXMODE={{ grubmenu_gfxmode }}"
    state: present
  become: true

- name: Ensure GRUB_THEME is set in /etc/default/grub
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: "^GRUB_THEME="
    line: 'GRUB_THEME="{{ grubmenu_themes_dir }}/{{ grubmenu_default_theme }}/theme.txt"'
    state: present
  become: true

- name: Substitute host in theme.txt
  ansible.builtin.lineinfile:
    path: "{{ grubmenu_themes_dir }}/{{ grubmenu_default_theme }}/theme.txt"
    regexp: 'text = "Host: CFG_HOST"'
    line: '  text = "Host: {{ inventory_hostname }}"'
    state: present
  become: true

- name: Substitute version in theme.txt
  ansible.builtin.lineinfile:
    path: "{{ grubmenu_themes_dir }}/{{ grubmenu_default_theme }}/theme.txt"
    regexp: 'text = "VERSION: CFG_VERSION"'
    line: '  text = "VERSION: {{ grubmenu_app_version }}"'
    state: present
  become: true

- name: Run update-grub to apply theme (Debian)
  ansible.builtin.command: update-grub
  changed_when: true
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - grubmenu_enable_regenerate

- name: Regenerate GRUB configuration (RedHat)
  # Fedora >= 34 keeps a wrapper stub on the ESP (/boot/efi/EFI/fedora/grub.cfg)
  # that only loads the real config — grub2-mkconfig refuses to overwrite it.
  # The real config always lives at /boot/grub2/grub.cfg (BIOS and UEFI).
  ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg
  changed_when: true
  become: true
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - grubmenu_enable_regenerate
