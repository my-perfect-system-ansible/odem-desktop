---
# Feature toggles — naming pattern: grubmenu_enable_<feature>

# Regenerate the GRUB configuration (update-grub / grub2-mkconfig). Disable
# where /boot is not a real boot mount (containers, chroots).
grubmenu_enable_regenerate: true
grubmenu_themes_dir: /boot/grub/themes
grubmenu_icons_dir: /boot/grub/icons

grubmenu_default_theme: anon

grubmenu_themes:
  - anon
  - showroom

grubmenu_icons:
  - light

grubmenu_gfxmode: 1920x1080
grubmenu_app_version: "1.0"
