---
# Lightweight verify for odem.desktop.thunderbird: the thunderbird package
# is installed on both platform families.

- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: thunderbird package is present
      ansible.builtin.assert:
        that: ansible_facts.packages['thunderbird'] is defined
        msg: thunderbird package missing
