---
- name: Install X11 packages (Debian)
  ansible.builtin.package:
    name: "{{ lightdm_packages_x11 }}"
    state: present
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - lightdm_enable_x11 | bool

- name: Install X11 packages (RedHat via dnf CLI)
  ansible.builtin.command: dnf install -y xorg-x11-server-Xorg xorg-x11-drv-nouveau xterm glx-utils mesa-demos freeglut-devel glm-devel libao-devel libXinerama-devel libXft-devel mesa-libGLU-devel
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - lightdm_enable_x11 | bool
  register: dnf_install_lightdm_x11
  changed_when: "'Nothing to do' not in dnf_install_lightdm_x11.stdout"
  become: true

- name: Install window manager packages (Debian)
  ansible.builtin.package:
    name: "{{ lightdm_packages_wm }}"
    state: present
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - lightdm_enable_wm | bool

- name: Install window manager packages (RedHat via dnf CLI)
  ansible.builtin.command: dnf install -y feh lxappearance lightdm xscreensaver xorg-x11-xinit xorg-x11-drv-amdgpu xorg-x11-drv-intel mesa-va-drivers mesa-vulkan-drivers xclip dconf dconf-editor
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - lightdm_enable_wm | bool
  register: dnf_install_lightdm_wm
  changed_when: "'Nothing to do' not in dnf_install_lightdm_wm.stdout"
  become: true

- name: Ensure lightdm wallpapers directory exists
  ansible.builtin.file:
    path: "{{ lightdm_wallpapers_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Check if lightdm greeter config exists
  ansible.builtin.stat:
    path: "{{ lightdm_greeter_conf }}"
  register: lightdm_greeter_conf_stat

- name: Set lightdm greeter background
  ansible.builtin.lineinfile:
    path: "{{ lightdm_greeter_conf }}"
    regexp: "^background="
    line: "background={{ lightdm_wallpapers_dir }}/{{ lightdm_wallpaper }}"
    state: present
    create: false
  become: true
  when: lightdm_greeter_conf_stat.stat.exists
