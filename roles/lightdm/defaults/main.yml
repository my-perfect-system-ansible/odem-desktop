---

# Feature toggles — naming pattern: lightdm_enable_<feature>
lightdm_enable_x11: true
lightdm_enable_wm: true

# Regular configuration

# Greeter wallpaper (deployed by odem.desktop.essentials).
lightdm_wallpaper: wormhole.jpg
lightdm_wallpapers_dir: /usr/share/images/desktop/wallpaper
lightdm_greeter_conf: /etc/lightdm/lightdm-gtk-greeter.conf

# X11 server + build dependencies (absorbed from the former odem.desktop.x11).
lightdm_packages_x11:
  - xorg
  - xserver-xorg-video-nouveau
  - xserver-xorg-video-vesa
  - xterm
  - mesa-utils
  - freeglut3-dev
  - libglm-dev
  - libao-dev
  - libxinerama-dev
  - libxft-dev
  - libglu1-mesa-dev

# Window manager support packages (absorbed from the former odem.desktop.wm).
lightdm_packages_wm:
  - feh
  - lxappearance
  - lightdm
  - picom
  - xscreensaver
  - xscreensaver-data-extra
  - xscreensaver-gl
  - xscreensaver-screensaver-bsod
  - x11-utils
  - xinit
  - x11-xserver-utils
  - xserver-xorg-video-amdgpu
  - xserver-xorg-video-nvidia
  - xserver-xorg-video-intel
  - mesa-va-drivers
  - mesa-vulkan-drivers
  - lxlock
  - xbacklight
  - numlockx
  - xclip
  - dconf-cli
  - dconf-editor
  - dunst