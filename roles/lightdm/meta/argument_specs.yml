argument_specs:
  main:
    short_description: Install X11 + WM packages, configure the lightdm greeter and per-user WM dotfiles
    options:
      lightdm_enable_x11:
        type: bool
        required: false
        default: true
        description: Install the X11 server + build dependency packages (former odem.desktop.x11)
      lightdm_enable_wm:
        type: bool
        required: false
        default: true
        description: Install window manager support packages and deploy the per-user
          picom/dunst dotfiles (former odem.desktop.wm)
      lightdm_enable_service:
        type: bool
        required: false
        default: true
        description: Enable and start the lightdm systemd service (Fedora ships no
          preset — the unit stays disabled after install) and set
          graphical.target as the default boot target (only graphical.target
          starts display-manager.service at boot — a multi-user default boots
          to a console). Molecule scenarios set this to false (containers
          have no systemd).
      lightdm_enable_autologin:
        type: bool
        required: false
        default: true
        description: Configure passwordless graphical autologin (autologin group,
          PAM file, seat dropin) for the first present user opted into
          C(user_roles.desktop_lightdm) or C(lightdm_autologin_user).
      lightdm_autologin_user:
        type: str
        required: false
        default: ""
        description: Autologin account — empty selects the first present user
          opted into C(user_roles.desktop_lightdm).
      lightdm_autologin_session:
        type: str
        required: false
        default: qtile
        description: Session name (the Name of an /usr/share/xsessions .desktop file)
          started by autologin.
      lightdm_autologin_group:
        type: str
        required: false
        default: autologin
        description: Group gating passwordless autologin in the PAM file
          (C(pam_succeed_if.so user ingroup ...)).
      lightdm_autologin_pam:
        type: str
        required: false
        default: /etc/pam.d/lightdm-autologin
        description: Path of the lightdm autologin PAM file (deployed on RedHat —
          Debian's lightdm package ships its own).
      lightdm_confd_dir:
        type: str
        required: false
        default: /etc/lightdm/lightdm.conf.d
        description: lightdm drop-in configuration directory.
      lightdm_autologin_dropin:
        type: str
        required: false
        default: 99-mps-autologin.conf
        description: Name of the autologin dropin inside C(lightdm_confd_dir).
      lightdm_wallpaper:
        type: str
        required: false
        default: wormhole.jpg
        description: Wallpaper filename (must be in lightdm_wallpapers_dir)
      lightdm_wallpapers_dir:
        type: str
        required: false
        default: /usr/share/images/desktop/wallpaper
        description: Directory containing wallpaper images (odem.desktop.essentials deploys this)
      lightdm_greeter_conf:
        type: str
        required: false
        default: /etc/lightdm/lightdm-gtk-greeter.conf
        description: Path to the lightdm gtk greeter config file
      lightdm_packages_x11:
        type: list
        required: false
        default:
          - xorg
          - xserver-xorg-video-nouveau
          - xserver-xorg-video-vesa
          - xterm
          - mesa-utils
          - freeglut3-dev
          - libglm-dev
          - libao-dev
          - libxinerama-dev
          - libxft-dev
          - libglu1-mesa-dev
        description: X11 server + build dependency packages (Debian defaults)
      lightdm_packages_wm:
        type: list
        required: false
        default:
          - feh
          - lxappearance
          - lightdm
          - picom
          - xscreensaver
          - xscreensaver-data-extra
          - xscreensaver-gl
          - xscreensaver-screensaver-bsod
          - x11-utils
          - xinit
          - x11-xserver-utils
          - xserver-xorg-video-amdgpu
          - xserver-xorg-video-nvidia
          - xserver-xorg-video-intel
          - mesa-va-drivers
          - mesa-vulkan-drivers
          - lxlock
          - xbacklight
          - numlockx
          - xclip
          - dconf-cli
          - dconf-editor
          - dunst
        description: Window manager support packages (Debian defaults)
