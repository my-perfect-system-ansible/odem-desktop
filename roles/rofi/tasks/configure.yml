---
- name: Ensure per-user .config directory exists
  ansible.builtin.file:
    path: "{{ entity.home }}/.config"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.desktop_rofi | default(false)
    - entity.state == 'present'
  become: true

- name: Ensure per-user rofi config directory exists
  ansible.builtin.file:
    path: "{{ entity.home }}/.config/rofi"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.desktop_rofi | default(false)
    - entity.state == 'present'
  become: true

- name: Copy per-user rofi config
  ansible.builtin.copy:
    src: "{{ rofi_repo_dest }}/config/rofi/"
    dest: "{{ entity.home }}/.config/rofi/"
    remote_src: true
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
    directory_mode: "0700"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.desktop_rofi | default(false)
    - entity.state == 'present'
  become: true

- name: Ensure per-user .local/bin directory exists
  ansible.builtin.file:
    path: "{{ entity.home }}/.local/bin"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.desktop_rofi | default(false)
    - entity.state == 'present'

- name: Copy per-user rofi helper scripts
  ansible.builtin.copy:
    src: "{{ rofi_repo_dest }}/scripts/{{ pair.0 }}"
    dest: "{{ pair.1.home }}/.local/bin/{{ pair.0 }}"
    remote_src: true
    owner: "{{ pair.1.name }}"
    group: "{{ pair.1.group | default(pair.1.name) }}"
    mode: "0700"
  loop: "{{ rofi_scripts | product(user_resolved | selectattr('state', 'equalto', 'present') | list) | list }}"
  loop_control:
    loop_var: pair
    label: "{{ pair.1.name }}/{{ pair.0 }}"
  when:
    - pair.1.user_roles.desktop_rofi | default(false)
  become: true
