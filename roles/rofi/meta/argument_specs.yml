argument_specs:
  main:
    short_description: Install rofi launcher + per-user config and 8 boot scripts
    options:
      rofi_packages:
        type: list
        required: false
        default:
        - rofi
        description: Rofi packages
      rofi_repo_url:
        type: str
        required: false
        default: https://github.com/my-perfect-system/mps-desktop-rofi.git
        description: mps-desktop-rofi git repository URL
      rofi_repo_dest:
        type: str
        required: false
        default: "{{ user_default_repo_dir_mps }}/mps-desktop-rofi"
        description: Destination path for the mps-desktop-rofi clone
      rofi_repo_version:
        type: str
        required: false
        default: main
        description: Branch or tag of the mps-desktop-rofi repository to deploy
      rofi_themes_dir:
        type: str
        required: false
        default: /usr/share/rofi/themes
        description: System-wide rofi themes directory
      rofi_themes:
        type: list
        required: false
        default:
        - rofi-boot-autorandr.rasi
        - rofi-boot-dwmswitch.rasi
        - rofi-boot-launcher.rasi
        - rofi-boot-powermenu.rasi
        description: Rofi theme filenames to deploy to rofi_themes_dir
      rofi_scripts:
        type: list
        required: false
        default:
        - rofi-boot-launcher.bash
        - rofi-boot-powermenu.bash
        - rofi-boot-autorandr.bash
        - rofi-boot-dwmswitch.bash
        - rofi-boot-tmux.bash
        - rofi-boot-tmuxinator.bash
        - rofi-boot-tmux-sessionizer.bash
        - rofi-boot-tmux-tmuxinizer.bash
        description: Per-user rofi boot scripts to deploy to ~/.local/bin/
