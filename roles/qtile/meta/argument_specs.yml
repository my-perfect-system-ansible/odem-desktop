argument_specs:
  main:
    short_description: Install qtile + per-user config copied from the mps-desktop-qtile repo
    options:
      qtile_packages:
        type: list
        required: false
        default:
        - python3-psutil
        - python3-pip
        - python-dbus-dev
        - python3-pulsectl
        - git
        - bpytop
        - libpangocairo-1.0-0
        - lightdm
        - lightdm-gtk-greeter
        description: Qtile system dependencies
      qtile_repo_url:
        type: str
        required: false
        default: https://github.com/qtile/qtile
        description: Git URL of the qtile repository
      qtile_repo_version:
        type: str
        required: false
        default: v0.31.0
        description: Git ref (tag/branch) of the qtile repository to clone
      qtile_repo_dest:
        type: str
        required: false
        default: ~/venvs/qtile/src
        description: Per-user path to clone the qtile repo (use ~ for home dir)
      qtile_config_repo_url:
        type: str
        required: false
        default: https://github.com/my-perfect-system/mps-desktop-qtile.git
        description: Git URL of our qtile config repo (config + xsession + scripts)
      qtile_config_repo_dest:
        type: str
        required: false
        default: /srv/repo/github/my-perfect-system/mps/mps-desktop-qtile
        description: Clone destination of our qtile config repo (see defaults/main.yml)
      qtile_config_repo_version:
        type: str
        required: false
        default: main
        description: Git ref (tag/branch) of our qtile config repo to clone
      qtile_venv_path:
        type: str
        required: false
        default: ~/.venvs/qtile
        description: Python venv path for qtile (defaults to ~/.venvs/qtile to avoid
          collision with odem.terminal.python)
      qtile_xsessions_dir:
        type: str
        required: false
        default: /usr/share/xsessions
        description: Xsession .desktop file directory
      qtile_xsessions_file:
        type: str
        required: false
        default: qtile.desktop
        description: Xsession .desktop file name
      qtile_xsessions_path:
        type: str
        required: false
        default: '{{ qtile_xsessions_dir }}/{{ qtile_xsessions_file }}'
        description: Full destination path for the xsession .desktop file (derived
          from dir+file)
      qtile_local_bin_dir:
        type: str
        required: false
        default: /usr/local/bin
        description: System-wide bin dir for qtile scripts
      qtile_local_bin_scripts:
        type: list
        required: false
        default:
        - qtile-startup.bash
        - qtile-reload.bash
        - qtile-restart.bash
        description: Qtile scripts to deploy to /usr/local/bin/
      qtile_user_scripts:
        type: list
        required: false
        default:
        - qtile-autostart-start.bash
        - qtile-autostart-stop.bash
        description: Qtile scripts to deploy to ~/.local/bin/ (per-user)