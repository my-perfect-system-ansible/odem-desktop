---

# Qtile system dependencies (RedHat build prerequisites install inline in
# tasks/install.yml via the dnf CLI).
qtile_packages:
  - python3-psutil
  - python3-pip
  - python-dbus-dev
  - python3-pulsectl
  - git
  - bpytop
  - libpangocairo-1.0-0
  - lightdm
  - lightdm-gtk-greeter

# Upstream qtile source, cloned and pip-installed per user into a venv.
qtile_repo_url: https://github.com/qtile/qtile
qtile_repo_version: v0.31.0
qtile_repo_dest: ~/venvs/qtile/src

# Our config repo (plain files, copied per user — all site/user-specific
# values live in its config/qtile/settings.py; distinct from the upstream
# qtile source repo above).
qtile_config_repo_url: https://github.com/my-perfect-system/mps-desktop-qtile.git
qtile_config_repo_dest: "{{ user_default_repo_dir_mps }}/mps-desktop-qtile"
qtile_config_repo_version: main

qtile_venv_path: ~/.venvs/qtile

qtile_xsessions_dir: /usr/share/xsessions
qtile_xsessions_file: qtile.desktop
qtile_xsessions_path: "{{ qtile_xsessions_dir }}/{{ qtile_xsessions_file }}"

qtile_local_bin_dir: /usr/local/bin
qtile_local_bin_scripts:
  - qtile-startup.bash
  - qtile-reload.bash
  - qtile-restart.bash

qtile_user_scripts:
  - qtile-autostart-start.bash
  - qtile-autostart-stop.bash