---
- name: Ensure per-user qtile config directory exists
  ansible.builtin.file:
    path: "{{ entity.home }}/.config/qtile"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.desktop_qtile | default(false)
    - entity.state == 'present'

- name: Ensure per-user .local/bin directory exists
  ansible.builtin.file:
    path: "{{ entity.home }}/.local/bin"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.desktop_qtile | default(false)
    - entity.state == 'present'

- name: Copy per-user qtile config
  ansible.builtin.copy:
    src: "{{ qtile_config_repo_dest }}/config/qtile/"
    dest: "{{ entity.home }}/.config/qtile/"
    remote_src: true
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0644"
    directory_mode: "0700"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.desktop_qtile | default(false)
    - entity.state == 'present'
  become: true

- name: Copy per-user .xinitrc
  ansible.builtin.copy:
    src: "{{ qtile_config_repo_dest }}/home/.xinitrc"
    dest: "{{ entity.home }}/.xinitrc"
    remote_src: true
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.desktop_qtile | default(false)
    - entity.state == 'present'
  become: true

- name: Copy per-user .xsessionrc
  ansible.builtin.copy:
    src: "{{ qtile_config_repo_dest }}/home/.xsessionrc"
    dest: "{{ entity.home }}/.xsessionrc"
    remote_src: true
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.desktop_qtile | default(false)
    - entity.state == 'present'
  become: true

- name: Copy per-user qtile helper scripts
  ansible.builtin.copy:
    src: "{{ qtile_config_repo_dest }}/scripts/{{ pair.0 }}"
    dest: "{{ pair.1.home }}/.local/bin/{{ pair.0 }}"
    remote_src: true
    owner: "{{ pair.1.name }}"
    group: "{{ pair.1.group | default(pair.1.name) }}"
    mode: "0700"
  loop: "{{ qtile_user_scripts | product(user_resolved | selectattr('state', 'equalto', 'present') | list) | list }}"
  loop_control:
    loop_var: pair
    label: "{{ pair.1.name }}/{{ pair.0 }}"
  when:
    - pair.1.user_roles.desktop_qtile | default(false)
  become: true