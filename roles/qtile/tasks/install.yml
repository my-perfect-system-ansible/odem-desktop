---
- name: Check if repo directory exists
  ansible.builtin.file:
    path: "{{ user_default_repo_dir_mps }}"
    state: directory
    mode: "0777"
    owner: "root"
    group: "root"

- name: Check if mps-desktop-qtile directory exists
  ansible.builtin.stat:
    path: "{{ qtile_config_repo_dest }}"
  register: qtile_config_repo_dir

- name: Check if mps-desktop-qtile is a Git repository
  ansible.builtin.stat:
    path: "{{ qtile_config_repo_dest }}/.git"
  register: qtile_config_git_dir
  when: qtile_config_repo_dir.stat.exists

- name: Clone mps-desktop-qtile repository
  ansible.builtin.git:
    repo: "{{ qtile_config_repo_url }}"
    dest: "{{ qtile_config_repo_dest }}"
    version: "{{ qtile_config_repo_version }}"
    force: true
  become: true
  when: not qtile_config_repo_dir.stat.exists

- name: Ensure permissions for target directory
  ansible.builtin.file:
    path: "{{ qtile_config_repo_dest }}"
    state: directory
    owner: "root"
    group: "{{ user_default_admin_group }}"
    recurse: yes
    mode: "2775"
  become: true

- name: Pull mps-desktop-qtile repository
  ansible.builtin.git:
    repo: "{{ qtile_config_repo_url }}"
    dest: "{{ qtile_config_repo_dest }}"
    version: "{{ qtile_config_repo_version }}"
    force: true
    update: true
  become: true
  when:
    - qtile_config_repo_dir.stat.exists
    - qtile_config_git_dir.stat.exists
- name: Install qtile apt packages (Debian)
  ansible.builtin.package:
    name: "{{ qtile_packages }}"
    state: present
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install qtile build dependencies (RedHat via dnf CLI)
  ansible.builtin.command: dnf install -y python3-devel python3-pip git libxcb-devel xcb-util-keysyms-devel xcb-util-wm-devel libxkbcommon-devel libxkbcommon-x11-devel libXinerama-devel libXft-devel cairo-devel pango-devel libffi-devel
  when: ansible_facts['os_family'] == 'RedHat'
  register: dnf_install_qtile
  changed_when: "'Nothing to do' not in dnf_install_qtile.stdout"
  become: true

- name: Create per-user qtile virtualenv
  ansible.builtin.command:
    cmd: sudo -u {{ entity.name }} python3 -m venv "{{ entity.home }}/.venvs/qtile"
    creates: "{{ entity.home }}/.venvs/qtile"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.desktop_qtile | default(false)
    - entity.state == 'present'

- name: Clone qtile source repository per user
  ansible.builtin.command:
    cmd: sudo -u {{ entity.name }} git clone --single-branch --branch "{{ qtile_repo_version }}" "{{ qtile_repo_url }}" "{{ qtile_repo_dest | regex_replace('^~', entity.home) }}"
    creates: "{{ qtile_repo_dest | regex_replace('^~', entity.home) }}"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.desktop_qtile | default(false)
    - entity.state == 'present'

- name: Install qtile from source per user
  ansible.builtin.command:
    cmd: sudo -u {{ entity.name }} "{{ entity.home }}/.venvs/qtile/bin/pip" install "{{ qtile_repo_dest | regex_replace('^~', entity.home) }}"
    creates: "{{ entity.home }}/.venvs/qtile/bin/qtile"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.desktop_qtile | default(false)
    - entity.state == 'present'

- name: Install psutil into qtile venv per user
  ansible.builtin.command:
    cmd: sudo -u {{ entity.name }} "{{ entity.home }}/.venvs/qtile/bin/pip" install psutil
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.desktop_qtile | default(false)
    - entity.state == 'present'

- name: Ensure per-user qtile venv has correct ownership
  ansible.builtin.file:
    path: "{{ entity.home }}/.venvs/qtile"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
    recurse: true
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.desktop_qtile | default(false)
    - entity.state == 'present'

- name: Ensure qtile xsessions directory exists
  ansible.builtin.file:
    path: "{{ qtile_xsessions_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy qtile xsession desktop file
  ansible.builtin.copy:
    src: "{{ qtile_config_repo_dest }}/etc/qtile.desktop"
    dest: "{{ qtile_xsessions_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Ensure qtile local bin directory exists
  ansible.builtin.file:
    path: "{{ qtile_local_bin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Copy qtile system scripts to local bin
  ansible.builtin.copy:
    src: "{{ qtile_config_repo_dest }}/scripts/{{ item }}"
    dest: "{{ qtile_local_bin_dir }}/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop: "{{ qtile_local_bin_scripts }}"
  loop_control:
    label: "{{ item }}"
  become: true
