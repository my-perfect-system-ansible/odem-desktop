---
- name: Install spotify package prereqs (Debian)
  ansible.builtin.package:
    name: "{{ spotify_packages }}"
    state: present
    update_cache: true
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Download Spotify GPG key (Debian)
  ansible.builtin.get_url:
    url: "{{ spotify_key_url }}"
    dest: /tmp/spotify.pub
    mode: "0644"
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Dearmor Spotify key into keyring (Debian)
  ansible.builtin.command:
    cmd: "gpg --dearmor --yes -o {{ spotify_keyring_path }} /tmp/spotify.pub"
    creates: "{{ spotify_keyring_path }}"
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Add Spotify apt repository (Debian)
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by={{ spotify_keyring_path }}] {{ spotify_repo_url }} stable non-free"
    filename: "{{ spotify_apt_filename }}"
    state: present
    update_cache: true
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install spotify-client package (Debian)
  ansible.builtin.package:
    name: spotify-client
    state: present
    update_cache: true
  become: true
  when: ansible_facts['os_family'] == 'Debian'
