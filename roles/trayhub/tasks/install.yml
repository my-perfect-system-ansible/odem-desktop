---
- name: Check if repo directory exists
  ansible.builtin.file:
    path: "{{ user_default_repo_dir_mps }}"
    state: directory
    mode: "0777"
    owner: "root"
    group: "root"

- name: Check if mps-desktop-trayhub directory exists
  ansible.builtin.stat:
    path: "{{ trayhub_repo_dest }}"
  register: trayhub_repo_dir

- name: Check if mps-desktop-trayhub is a Git repository
  ansible.builtin.stat:
    path: "{{ trayhub_repo_dest }}/.git"
  register: trayhub_git_dir
  when: trayhub_repo_dir.stat.exists

- name: Clone mps-desktop-trayhub repository
  ansible.builtin.git:
    repo: "{{ trayhub_repo_url }}"
    dest: "{{ trayhub_repo_dest }}"
    version: "{{ trayhub_repo_version }}"
    force: true
  become: true
  when: not trayhub_repo_dir.stat.exists

- name: Ensure permissions for target directory
  ansible.builtin.file:
    path: "{{ trayhub_repo_dest }}"
    state: directory
    owner: "root"
    group: "{{ user_default_admin_group }}"
    recurse: yes
    mode: "2775"
  become: true

- name: Pull mps-desktop-trayhub repository
  ansible.builtin.git:
    repo: "{{ trayhub_repo_url }}"
    dest: "{{ trayhub_repo_dest }}"
    version: "{{ trayhub_repo_version }}"
    force: true
    update: true
  become: true
  when:
    - trayhub_repo_dir.stat.exists
    - trayhub_git_dir.stat.exists

- name: Install PyQt6 runtime (Debian)
  ansible.builtin.package:
    name: "{{ trayhub_packages }}"
    state: present
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - trayhub_enable_packages | bool

- name: Install PyQt6 runtime (RedHat via dnf CLI)
  ansible.builtin.command: dnf install -y {{ trayhub_packages | join(' ') }}
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - trayhub_enable_packages | bool
  register: dnf_install_trayhub
  changed_when: "'Nothing to do' not in dnf_install_trayhub.stdout"
  become: true