argument_specs:
  main:
    short_description: Install thunar + plugins and per-user dotfiles
    options:
      thunar_packages:
        type: list
        required: false
        default:
        - thunar
        - thunar-archive-plugin
        - thunar-media-tags-plugin
        - thunar-volman
        - thunar-gtkhash
        - thunarx-python
        description: Thunar core + plugin packages
      thunar_xfce_packages:
        type: list
        required: false
        default:
        - xfce4-goodies
        - xfce4-places-plugin
        - thunar-font-manager
        description: XFCE4 packages used by thunar
      thunar_repo_url:
        type: str
        required: false
        default: https://github.com/my-perfect-system/mps-desktop-thunar.git
        description: Git repository shipping thunar configuration
      thunar_repo_dest:
        type: str
        required: false
        default: "{{ user_default_repo_dir_mps }}/mps-desktop-thunar"
        description: Destination path for the cloned mps-desktop-thunar repository
      thunar_repo_version:
        type: str
        required: false
        default: main
        description: Branch or tag of the mps-desktop-thunar repository to use
