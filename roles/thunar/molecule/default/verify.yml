---
# Lightweight verify for odem.desktop.thunar: the package and per-user
# Thunar/xfce4 config exist.

- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: thunar package is present
      ansible.builtin.assert:
        that: ansible_facts.packages['thunar'] is defined
        msg: thunar package missing

    - name: Per-user Thunar config exists
      ansible.builtin.stat:
        path: /home/molecule_user/.config/Thunar
      register: thunar_config
      failed_when: not thunar_config.stat.exists
