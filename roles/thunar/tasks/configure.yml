---
- name: Ensure per-user config directories exist
  ansible.builtin.file:
    path: "{{ item.0.home }}/{{ item.1 }}"
    state: directory
    mode: "0700"
    owner: "{{ item.0.name }}"
    group: "{{ item.0.group | default(item.0.name) }}"
  loop: "{{ user_resolved | product(['.config', '.config/Thunar', '.config/xfce4']) }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"
  when: item.0.state == 'present' and item.0.user_roles.desktop_thunar | default(false)
  become: true

- name: Copy per-user Thunar config
  ansible.builtin.copy:
    src: "{{ thunar_repo_dest }}/config/Thunar/"
    dest: "{{ entity.home }}/.config/Thunar/"
    remote_src: true
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
    directory_mode: "0700"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when: entity.state == 'present' and entity.user_roles.desktop_thunar | default(false)
  become: true

- name: Copy per-user xfce4 config
  ansible.builtin.copy:
    src: "{{ thunar_repo_dest }}/config/xfce4/"
    dest: "{{ entity.home }}/.config/xfce4/"
    remote_src: true
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
    directory_mode: "0700"
  loop: "{{ user_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when: entity.state == 'present' and entity.user_roles.desktop_thunar | default(false)
  become: true
