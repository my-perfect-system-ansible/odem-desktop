---
# Canonical ecosystem global — exposed per play by the lazy identity guard
# (odem.os.user defaults via include_role public: true); mirrored here so
# argument-spec validation can render the templated defaults below before
# the guard runs. Keep in sync with odem-os/roles/user/defaults/main.yml;
# inventory overrides still win.
user_default_repo_dir_mps: /srv/repo/github/my-perfect-system/mps

kanata_repo_url: https://github.com/my-perfect-system/mps-desktop-kanata.git
kanata_repo_dest: "{{ user_default_repo_dir_mps }}/mps-desktop-kanata"
kanata_repo_version: main

kanata_cargo_features: cmd

kanata_config_path: ~/.config/kanata/kanata.kbd

kanata_udev_rule_path: /etc/udev/rules.d/99-kanata-uinput.rules
kanata_udev_rule_content: |
  KERNEL=="uinput", MODE="0660", GROUP="uinput", OPTIONS+="static_node=uinput"

kanata_modules_load_path: /etc/modules-load.d/uinput.conf
kanata_modules_load_content: |
  uinput

kanata_packages:
  - udev
