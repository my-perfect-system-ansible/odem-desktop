---
# Minimal converge: invoke the role with default vars + a synthetic user
# opted into exactly this role so identity-resolved consumers see something.

- name: Converge
  hosts: all
  become: true
  vars:
    user_catalog:
      molecule_user:
        user_roles:
          desktop_kanata: true
    user_list:
      - name: molecule_user
    # Containers have no udev daemon, no loadable kernel modules, no systemd:
    # the deploys (rule/config/service files, configs) run, the live
    # activation steps stay off.
    kanata_enable_udev_reload: false
    kanata_enable_kernel_module: false
    kanata_enable_service: false
  roles:
    - role: odem.desktop.kanata
