argument_specs:
  main:
    short_description: Install kanata keyboard remapper + per-user systemd service
    options:
      kanata_repo_url:
        type: str
        required: false
        default: https://github.com/my-perfect-system/mps-desktop-kanata.git
        description: Git repository shipping the kanata configuration
      kanata_repo_dest:
        type: str
        required: false
        default: "{{ user_default_repo_dir_mps }}/mps-desktop-kanata"
        description: Destination path for the mps-desktop-kanata repository clone
      kanata_repo_version:
        type: str
        required: false
        default: main
        description: Branch or tag of the mps-desktop-kanata repository to clone
      kanata_cargo_features:
        type: str
        required: false
        default: cmd
        description: Cargo features for kanata (e.g. 'cmd', 'passthru_ahk')
      kanata_config_path:
        type: str
        required: false
        default: ~/.config/kanata/kanata.kbd
        description: Per-user kanata config path (use `~` for home dir)
      kanata_udev_rule_path:
        type: str
        required: false
        default: /etc/udev/rules.d/99-kanata-uinput.rules
        description: Path to install the udev rule for uinput
      kanata_udev_rule_content:
        type: str
        required: false
        default: 'KERNEL=="uinput", MODE="0660", GROUP="uinput", OPTIONS+="static_node=uinput"

          '
        description: Content of the udev rule for uinput
      kanata_modules_load_path:
        type: str
        required: false
        default: /etc/modules-load.d/uinput.conf
        description: Path to install the modules-load config for uinput
      kanata_modules_load_content:
        type: str
        required: false
        default: 'uinput

          '
        description: Content of the modules-load config for uinput
      kanata_packages:
        type: list
        required: false
        default:
        - udev
        description: Packages required for kanata (uinput group, udev rules; Debian only, systemd provides udev on RedHat)
