---
# Minimal converge: invoke the role with default vars + a synthetic user
# opted into exactly this role so identity-resolved consumers see something.

- name: Converge
  hosts: all
  become: true
  vars:
    user_catalog:
      molecule_user:
        user_roles:
          desktop_essentials: true
    user_list:
      - name: molecule_user
  roles:
    - role: odem.desktop.essentials
