---
- name: Install base desktop packages (Debian)
  ansible.builtin.package:
    name: "{{ essentials_packages_base }}"
    state: present
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install base desktop packages (RedHat via dnf CLI)
  ansible.builtin.command: dnf install -y galculator iw espeak lxde-icon-theme thunderbird firefox evince ddcutil
  when: ansible_facts['os_family'] == 'RedHat'
  register: dnf_install_essentials_base
  changed_when: "'Nothing to do' not in dnf_install_essentials_base.stdout"
  become: true

- name: Install sound stack packages (Debian)
  ansible.builtin.package:
    name: "{{ essentials_packages_sound }}"
    state: present
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install sound stack packages (RedHat via dnf CLI)
  ansible.builtin.command: dnf install -y pavucontrol vorbis-tools
  when: ansible_facts['os_family'] == 'RedHat'
  register: dnf_install_essentials_sound
  changed_when: "'Nothing to do' not in dnf_install_essentials_sound.stdout"
  become: true

- name: Install XDG utility packages (Debian)
  ansible.builtin.package:
    name: "{{ essentials_packages_xdg }}"
    state: present
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install XDG utility packages (RedHat via dnf CLI)
  ansible.builtin.command: dnf install -y xdg-utils xdg-user-dirs
  when: ansible_facts['os_family'] == 'RedHat'
  register: dnf_install_essentials_xdg
  changed_when: "'Nothing to do' not in dnf_install_essentials_xdg.stdout"
  become: true

- name: Install GNOME tools packages (Debian)
  ansible.builtin.package:
    name: "{{ essentials_packages_gnome }}"
    state: present
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - essentials_enable_gnome | bool

- name: Install GNOME tools packages (RedHat via dnf CLI)
  ansible.builtin.command: dnf install -y gnome-system-monitor network-manager-applet gedit gedit-plugins
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - essentials_enable_gnome | bool
  register: dnf_install_essentials_gnome
  changed_when: "'Nothing to do' not in dnf_install_essentials_gnome.stdout"
  become: true

- name: Ensure images target dir exists
  ansible.builtin.file:
    path: "{{ essentials_bootsplash_dst | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Ensure wallpapers target dir exists
  ansible.builtin.file:
    path: "{{ essentials_wallpapers_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Copy bootsplash image
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/images/{{ essentials_bootsplash_src }}"
    dest: "{{ essentials_bootsplash_dst }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Copy wallpapers
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/wallpaper/{{ item }}"
    dest: "{{ essentials_wallpapers_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ essentials_wallpapers_list }}"
  become: true
