---
- name: Install wm packages (Debian)
  ansible.builtin.package:
    name: "{{ wm_packages }}"
    state: present
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install wm packages (RedHat via dnf CLI)
  ansible.builtin.command: dnf install -y feh lxappearance lightdm xscreensaver xorg-x11-xinit xorg-x11-drv-amdgpu xorg-x11-drv-intel mesa-va-drivers mesa-vulkan-drivers xclip dconf dconf-editor
  when: ansible_facts['os_family'] == 'RedHat'
  register: dnf_install_wm
  changed_when: "'Nothing to do' not in dnf_install_wm.stdout"
  become: true
